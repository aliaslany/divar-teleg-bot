name: Run Divar Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you trigger it manually too

permissions:
  contents: write

concurrency:
  group: divar-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        id: runbot
        env:
          SEARCH_CITY_IDS: ${{ secrets.SEARCH_CITY_IDS }}
          SEARCH_CATEGORY: ${{ secrets.SEARCH_CATEGORY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_CHATID: ${{ secrets.BOT_CHATID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DEBUG_DUMP_SECTIONS : ${{ 1 }}
          SLEEP_SEC: ${{ secrets.SLEEP_SEC }}
        run: python main.py


      - name: Commit updated state file
        id: statecommit
        if: ${{ always() && (steps.runbot.outcome == 'success' || steps.runbot.outcome == 'failure') && hashFiles('tokens.json') != '' }}
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- tokens.json
          if git diff --staged --quiet -- tokens.json; then
            echo "No state changes to commit."
            exit 0
          fi

          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::State can only be saved to a branch; rerun this workflow with a branch ref."
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Update seen ads state" -- tokens.json

          for attempt in 1 2 3; do
            git fetch origin "$STATE_BRANCH"
            if ! git rebase "origin/$STATE_BRANCH"; then
              git rebase --abort
              echo "::error::State changes conflict with the remote branch; resolve the conflict before retrying."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$STATE_BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; checking for concurrent branch changes."
          done

          echo "::error::Unable to push saved state after 3 attempts."
          exit 1

      - name: Preserve state after a failed push
        if: ${{ always() && steps.statecommit.outcome == 'failure' && hashFiles('tokens.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sent-ad-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: tokens.json
