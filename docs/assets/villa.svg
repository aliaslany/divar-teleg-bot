<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="villa-title villa-description">
  <title id="villa-title">Illustration of a modern villa</title>
  <desc id="villa-description">A warm cream villa with arched windows and doorway, sage trees, and a sunlit desert garden.</desc>
  <defs>
    <linearGradient id="villa-sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e8e9d7"/>
      <stop offset="1" stop-color="#f8f0df"/>
    </linearGradient>
    <linearGradient id="villa-ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#dcd8be"/>
      <stop offset="1" stop-color="#c6caa4"/>
    </linearGradient>
    <linearGradient id="villa-plaster" x1="0" y1="0" x2="0" y2="1">
