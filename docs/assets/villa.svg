      <stop offset="1" stop-color="#eae2cc"/>
    </linearGradient>
    <linearGradient id="villa-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a7bdb1"/>
      <stop offset="1" stop-color="#607e70"/>
    </linearGradient>
    <linearGradient id="villa-door" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#526b5a"/>
      <stop offset="1" stop-color="#344c3c"/>
    </linearGradient>
    <radialGradient id="villa-halo">
      <stop stop-color="#f3e1b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f3e1b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="villa-shadow" x="-25%" y="-70%" width="150%" height="250%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

